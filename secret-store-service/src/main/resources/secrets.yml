# Source credentials and the service tokens allowed to fetch them.
# Authorization is checked independently for each source.

secrets:

  - sourceId:    student-registry
    engine:      postgresql
    jdbcUrl:     jdbc:postgresql://localhost:5432/registry
    username:    registry
    password:    registry
    driverClass: org.postgresql.Driver
    allowedTokens:
      - pg-sac-secret-token

  - sourceId:    academic-records
    engine:      mysql
    # READ-COMMITTED isolation so the mediator's pooled connections see
    # committed writes immediately.
    jdbcUrl:     "jdbc:mysql://localhost:5433/academics?sessionVariables=transaction_isolation='READ-COMMITTED'"
    username:    academics
    password:    academics
    driverClass: com.mysql.cj.jdbc.Driver
    allowedTokens:
      - mysql-sac-secret-token

  - sourceId:    student-activities
    engine:      mongodb
    mongoUri:    mongodb://mongo:mongo@localhost:5434/activities?authSource=admin
    database:    activities
    allowedTokens:
      - mongo-csa-secret-token

  - sourceId:       research-publications
    engine:         fuseki
    # Public query endpoint and credential-protected update endpoint.
    sparqlEndpoint:       http://localhost:5435/publications/sparql
    sparqlUpdateEndpoint: http://localhost:5435/publications/update
    username:             admin
    password:             admin
    allowedTokens:
      - publications-sac-secret-token
