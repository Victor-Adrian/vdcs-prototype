server:
  port: 8083

spring:
  application:
    name: vdcs-source-access-postgres-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

vdcs:
  secret-store:
    # The SAC holds no source credentials. It authenticates to the
    # Secret & Credential Store with this service token and pulls the
    # Student Registry connection details at startup.
    url:   http://localhost:8088
    token: pg-sac-secret-token
