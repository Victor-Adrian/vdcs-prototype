server:
  port: 8086

spring:
  application:
    name: vdcs-source-access-mongo-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

vdcs:
  csa:
    # Address of the Canonical Source Adapter service that this SAC
    # forwards to. The SAC has no MongoDB driver of its own - every
    # operation goes through the CSA.
    url: http://localhost:8085
