# Fuseki policy for the research publications repository.
# Reads are public. Updates require the pinned admin credential used by
# the publications service.

[main]
ssl.enabled = false

plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
# Pinned demo credential (user 'admin', password 'admin').
admin=admin

[roles]

[urls]
## Control functions open to anyone
/$/status = anon
/$/ping   = anon

## Admin/management endpoints are restricted
/$/** = authcBasic,user[admin]

## SPARQL Update is restricted (federated write-back authenticates here)
/*/update/** = authcBasic,user[admin]

## GSP update is restricted
/*/data/** = authcBasic,user[admin]

## Everything else (SPARQL query in particular) is open
/**=anon
